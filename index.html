<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZETI — Ведение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0B0B0A; --black-2:#161614; --black-3:#1E1E1B;
    --ivory:#EDE8DE; --ivory-dim:#55504A;
    --red:#B31217; --red-dim:#6E0C0F; --red-soft:rgba(179,18,23,0.18);
    --grey:#8A857C; --line:rgba(237,232,222,0.13); --cut:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--black); color:var(--ivory);
    font-family:'Inter',system-ui,sans-serif; font-size:15px; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1;}

  /* ---- splash intro ---- */
  #splash{position:fixed; inset:0; background:var(--black); z-index:999; display:flex; align-items:center;
    justify-content:center; flex-direction:column; overflow:hidden;}
  #splash::before{content:''; position:absolute; top:0; bottom:0; width:45%;
    background:linear-gradient(100deg, transparent, rgba(179,18,23,0.35), transparent);
    transform:translateX(-160%); animation:sweep 1.3s ease forwards .15s;}
  @keyframes sweep{ to{transform:translateX(260%);} }
  #splash img{height:88px; opacity:0; animation:splashIn .9s cubic-bezier(.2,.8,.2,1) forwards .1s; position:relative; z-index:1;}
  #splash .tag{font-family:'Barlow Condensed'; font-style:italic; font-weight:700; font-size:13px;
    letter-spacing:1.5px; color:var(--red); margin-top:16px; opacity:0;
    animation:splashIn .7s ease forwards .55s; position:relative; z-index:1;}
  @keyframes splashIn{ from{opacity:0; transform:translateY(16px) scale(.94);} to{opacity:1; transform:translateY(0) scale(1);} }
  #splash.hide{animation:splashOut .5s ease forwards;}
  @keyframes splashOut{ to{opacity:0; visibility:hidden;} }

  /* ---- ambient particles ---- */
  #particles{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .particle{position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
    background:var(--red); opacity:.45; animation:rise linear infinite;}
  @keyframes rise{ to{ transform:translateY(-115vh) translateX(var(--dx,0px)); opacity:0;} }

  header{background:var(--black); padding:26px 20px 16px; text-align:center; position:relative; border-bottom:1px solid var(--line);}
  header::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, var(--red-dim), var(--red) 30%, #ff4b4b 50%, var(--red) 70%, var(--red-dim));
    background-size:220% 100%; animation:shine 5s linear infinite;}
  @keyframes shine{ 0%{background-position:220% 0;} 100%{background-position:-220% 0;} }
  .logo-wrap{position:relative; display:inline-block;}
  .logo-glow{position:absolute; inset:-22px; background:radial-gradient(circle, var(--red) 0%, transparent 68%);
    filter:blur(16px); opacity:.35; animation:pulseGlow 3.2s ease-in-out infinite; z-index:0;}
  @keyframes pulseGlow{ 0%,100%{opacity:.28; transform:scale(1);} 50%{opacity:.55; transform:scale(1.12);} }
  .logo{height:52px; display:block; margin:0 auto; position:relative; z-index:1;}
  .level-switch{display:flex; justify-content:center; gap:0; margin-top:14px; position:relative; z-index:1;}
  .level-switch button{background:none; border:1px solid var(--line); border-right:none; color:var(--grey);
    font-family:'Barlow Condensed'; font-weight:700; font-size:12.5px; padding:6px 12px; cursor:pointer; transition:background .2s,color .2s;}
  .level-switch button:last-child{border-right:1px solid var(--line);}
  .level-switch button.active{background:var(--red); color:var(--ivory); border-color:var(--red);}

  main{flex:1; padding:22px 20px 104px; overflow-y:auto;}
  .view{display:none;}
  .view.active{display:block; animation:fadeIn .22s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateX(6px);} to{opacity:1; transform:translateX(0);} }

  .section-title{font-family:'Barlow Condensed'; font-weight:700; font-style:italic;
    font-size:26px; margin:2px 0 16px;}
  .sub-title{font-family:'Barlow Condensed'; font-weight:700; font-style:italic; color:var(--red);
    font-size:16px; margin:22px 0 10px;}

  .panel{background:var(--black-2); padding:18px; margin-bottom:20px;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);}
  .row-flex{display:flex; flex-direction:column; gap:12px;}
  .field{display:flex; flex-direction:column; gap:5px; flex:1;}
  .field label{font-size:11.5px; color:var(--grey);}
  .fields{display:flex; gap:12px;}
  input, textarea, select{background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ivory); font-family:'Inter'; font-size:15px; padding:6px 2px; width:100%; outline:none;}
  select{-webkit-appearance:none; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--grey) 50%),linear-gradient(135deg,var(--grey) 50%,transparent 50%);
    background-position:calc(100% - 12px) 14px, calc(100% - 7px) 14px; background-size:5px 5px; background-repeat:no-repeat;}
  input:focus, textarea:focus, select:focus{border-bottom-color:var(--red);}
  input::placeholder, textarea::placeholder{color:var(--grey);}
  textarea{resize:vertical; min-height:60px; border:1px solid var(--line); padding:10px;}

  button.primary{background:var(--red); color:var(--ivory); border:none; padding:13px 18px;
    font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer; margin-top:2px;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 10px 100%);}
  button.primary:active{background:var(--red-dim);}
  button.ghost{background:none; border:1px solid var(--line); color:var(--ivory); padding:10px 14px;
    font-size:13px; cursor:pointer; font-family:'Inter'; font-weight:500;}

  .rings{display:flex; justify-content:space-between; margin-bottom:20px;}
  .ring-item{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .ring-item .val{font-size:11px; color:var(--grey); font-variant-numeric:tabular-nums;}
  .ring-item .lbl{font-size:10.5px; color:var(--grey);}

  .day-group{margin-top:18px;}
  .day-label{font-family:'Barlow Condensed'; font-style:italic; font-weight:700; color:var(--red); font-size:15px; margin-bottom:6px;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;}
  .row .meta{color:var(--grey); font-variant-numeric:tabular-nums; font-size:13.5px;}
  .empty{color:var(--grey); font-size:13.5px; padding:24px 0; text-align:center; border:1px dashed var(--line);}

  .recipe-card{background:var(--black-3); padding:14px; margin-bottom:10px; border-left:2px solid var(--red);}
  .recipe-card .name{font-family:'Barlow Condensed'; font-weight:700; font-style:italic; font-size:17px;}
  .recipe-card .macros{font-size:12.5px; color:var(--grey); margin:4px 0 8px; font-variant-numeric:tabular-nums;}
  .recipe-card .steps{font-size:13.5px; color:var(--ivory-dim,#c9c4ba); line-height:1.5; display:none;}
  .recipe-card .steps.open{display:block;}
  .recipe-card .toggle{font-size:12px; color:var(--red); cursor:pointer; font-weight:600;}

  .supp-item{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
  .supp-info .time{font-size:12px; color:var(--grey); margin-top:2px;}
  .check{width:24px; height:24px; border:1px solid var(--grey); flex:0 0 auto; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ivory);
    clip-path:polygon(0 0, 100% 0, 100% 100%, 5px 100%);}
  .check.on{background:var(--red); border-color:var(--red);}

  .ai-note{font-size:12.5px; color:var(--grey); line-height:1.55; margin-bottom:16px; padding:14px; border:1px solid var(--line);}
  .ai-output{margin-top:16px; padding:16px 0 0; border-top:1px solid var(--line); font-size:14.5px; line-height:1.6; white-space:pre-wrap;}
  .ai-output.loading{color:var(--grey); font-style:italic;}

  .camera-box{border:1px dashed var(--line); padding:20px; text-align:center; margin-bottom:14px; position:relative;}
  .camera-box img{max-width:100%; max-height:160px; margin-top:10px;}
  .camera-box input[type=file]{display:none;}
  .camera-box label{color:var(--red); font-weight:600; font-size:13.5px; cursor:pointer;}

  .segmented{display:flex; margin-bottom:16px;}
  .segmented button{flex:1; background:var(--black-2); border:1px solid var(--line); color:var(--grey);
    font-family:'Barlow Condensed'; font-weight:700; font-size:13px; padding:9px 4px; cursor:pointer;}
  .segmented button.active{background:var(--red); color:var(--ivory); border-color:var(--red);}
  .segmented button:not(:last-child){border-right:none;}

  nav#tabbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    display:flex; background:var(--black-2); border-top:1px solid var(--line); z-index:2;}
  #tab-indicator{position:absolute; top:0; left:0; width:25%; height:2px; background:var(--red);
    transition:transform .28s cubic-bezier(.3,.9,.3,1); box-shadow:0 0 8px var(--red);}
  nav#tabbar button{flex:1; background:none; border:none; color:var(--grey); padding:12px 3px 11px;
    font-family:'Barlow Condensed'; font-weight:700; font-size:12px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:3px; transition:color .2s, transform .15s;}
  nav#tabbar button svg{width:18px; height:18px; stroke:currentColor; transition:transform .2s;}
  nav#tabbar button.active{color:var(--ivory);}
  nav#tabbar button.active svg{transform:translateY(-1px) scale(1.08);}
  nav#tabbar button:active{transform:scale(.94);}

  @keyframes cardIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .day-group, .recipe-card, .supp-item, .row{ animation:cardIn .35s ease both; }
  .ring-progress{ transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
  button.primary{ position:relative; overflow:hidden; }
  button.primary:active{ transform:scale(.98); }
</style>
</head>
